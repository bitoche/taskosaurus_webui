<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Calendar Top Red Gradient -->
    <linearGradient id="calRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Dinosaur Emerald Gradient -->
    <linearGradient id="dinoGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Dorsal Spikes Warm Orange Gradient -->
    <linearGradient id="spikeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="crispShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND: CALENDAR ================= -->
  <!-- White Calendar Card with rounded corners -->
  <rect x="3" y="5" width="58" height="55" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#crispShadow)"/>

  <!-- Calendar Top Red Header (instantly signals "Calendar") -->
  <path d="M 3 18 C 3 10.82 8.82 5 16 5 L 48 5 C 55.18 5 61 10.82 61 18 L 61 21 L 3 21 Z" fill="url(#calRed)"/>

  <!-- Calendar Binder Loops/Rings -->
  <rect x="15" y="2" width="6" height="7" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <rect x="43" y="2" width="6" height="7" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>

  <!-- Clean Calendar Day Indicator Bars in Background -->
  <rect x="10" y="25" width="10" height="3" rx="1.5" fill="#e2e8f0"/>
  <rect x="24" y="25" width="10" height="3" rx="1.5" fill="#e2e8f0"/>
  <rect x="38" y="25" width="16" height="3" rx="1.5" fill="#fecaca"/>

  <!-- ================= FOREGROUND: BOLD DINOSAUR ================= -->
  <!-- 1. Large, Eye-Catching Orange Spikes on the Head/Neck (Super distinct dino feature) -->
  <g stroke="#9a3412" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="12,23 3,17 12,14" fill="url(#spikeGold)"/>
    <polygon points="16,15 11,6 23,8" fill="url(#spikeGold)"/>
    <polygon points="26,10 28,1 35,7" fill="url(#spikeGold)"/>
  </g>

  <!-- 2. Giant T-Rex Head Profile (Covers most of the card for 16px readability) -->
  <path d="
    M 14 58
    C 9 46 9 32 15 22
    C 20 15 31 12 43 13
    C 52 14 57 19 58 27
    C 59 34 54 36 44 36
    L 35 36
    C 45 38 48 40 54 43
    C 56 44 56 48 51 51
    C 45 54 39 51 34 50
    C 30 55 23 58 14 58 Z"
    fill="url(#dinoGreen)"
    stroke="#064e3b"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- 3. Dark Mouth Cavity -->
  <path d="M 35 36 L 46 36 C 53 36 55 38 52 42 C 48 40 43 38 35 36 Z" fill="#7f1d1d"/>

  <!-- 4. Big Sharp White Dinosaur Teeth (Chunky so they pop at 16px) -->
  <polygon points="38,36 41,41 43,36" fill="#ffffff" stroke="#064e3b" stroke-width="0.8"/>
  <polygon points="44,36 47,42 49,36" fill="#ffffff" stroke="#064e3b" stroke-width="0.8"/>
  <polygon points="50,36 52,41 54,37" fill="#ffffff" stroke="#064e3b" stroke-width="0.8"/>
  <!-- Bottom Jaw Tooth -->
  <polygon points="45,43 47,39 49,42" fill="#ffffff" stroke="#064e3b" stroke-width="0.8"/>

  <!-- 5. Big Expressive Dinosaur Eye -->
  <circle cx="34" cy="24" r="6" fill="#ffffff" stroke="#064e3b" stroke-width="2"/>
  <circle cx="35" cy="24" r="3.2" fill="#0f172a"/>
  <!-- White Specular Highlights in Eye -->
  <circle cx="36.5" cy="22.5" r="1.3" fill="#ffffff"/>
  <circle cx="33.5" cy="25.5" r="0.7" fill="#ffffff"/>

  <!-- 6. Dinosaur Snout Nostril -->
  <ellipse cx="52" cy="24" rx="1.5" ry="2" fill="#064e3b"/>

  <!-- 7. Cute T-Rex Tiny Arm -->
  <path d="M 28 47 C 32 46 35 49 33 52 C 31 53 29 52 27 49 Z" fill="#059669" stroke="#064e3b" stroke-width="1.8"/>
  <circle cx="33" cy="52" r="0.8" fill="#ffffff"/>
  <circle cx="31" cy="53" r="0.8" fill="#ffffff"/>
</svg>
