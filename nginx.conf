# 1. Сброс прямых обращений по IP и чужим доменам
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    
    # Сброс SSL handshake при обращении не по доменному имени
    ssl_reject_handshake on;

    # Внутренний healthcheck контейнера (127.0.0.1)
    location = / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 403;
    }
}

# 2. Редирект HTTP -> HTTPS для домена
server {
    listen 80;
    server_name taskosaurus.work.gd www.taskosaurus.work.gd;
    return 301 https://$host$request_uri;
}

# 3. Основной сервер HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name taskosaurus.work.gd www.taskosaurus.work.gd;

    ssl_certificate /etc/letsencrypt/live/taskosaurus.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskosaurus.work.gd/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Gzip сжатие для ускорения загрузки статики и API ответов
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проксирование запросов к бэкенду (FastAPI)
    location /api/ {
        proxy_pass http://taskservice:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
    }

    # Проксирование Swagger / ReDoc / OpenAPI (доступны при APP_DEBUG=true)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://taskservice:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Кэширование статических файлов сборки
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA роутинг: возврат index.html для всех несуществующих путей
    location / {
        try_files $uri $uri/ /index.html;
    }
}
